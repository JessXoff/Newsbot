name: Inanna/Ishtar News Bot

on:
  schedule:
    # Runs every 6 hours. Adjust to taste — GitHub Actions free tier cron
    # can be a few minutes late during high load, which is fine here.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated state.json back to the repo

concurrency:
  group: inanna-ishtar-news-bot-state
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm start

      - name: Commit updated state
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "inanna-news-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update seen-articles state [skip ci]"
          git push
